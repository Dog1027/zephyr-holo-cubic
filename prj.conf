# main() only idles, but every SYS_INIT (LVGL init, SD mount) runs on this stack.
# Measured peak 1344 bytes ("kernel thread stacks"), keep about 2x margin
CONFIG_MAIN_STACK_SIZE=3072
# The system heap is mostly for the Wi-Fi driver. Its default (HEAP_MEM_POOL_ADD_SIZE_ESP_WIFI,
# 51200) assumes 10 static RX buffers, 6 are used here (about 1.6 KB each), and DRAM region 0
# has no room for more. IGNORE_MIN makes this the whole heap instead of the sum of the minimums
CONFIG_HEAP_MEM_POOL_IGNORE_MIN=y
CONFIG_HEAP_MEM_POOL_SIZE=49152
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_ESP32_USE_UNSUPPORTED_REVISION=y
# -O2: LVGL software rendering and JPEG decoding are CPU bound, flash has plenty of room
CONFIG_SPEED_OPTIMIZATIONS=y

CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=2048
CONFIG_SHELL=y
# Measured 2976 / 3072 with the wlan commands: config.txt access puts the FatFs long file name
# buffer (512 bytes, FS_FATFS_LFN_MODE_STACK) and two config values on this stack
CONFIG_SHELL_STACK_SIZE=4096
# Logs reach the console through the shell, which has its own queue. INFO stays on during
# development (lower the levels for a release build) and the boot burst overflowed the default
CONFIG_SHELL_BACKEND_SERIAL_LOG_MESSAGE_QUEUE_SIZE=2048
CONFIG_SHELL_BACKEND_SERIAL=y

CONFIG_SPI=y
# With DMA, transfers wait on an interrupt instead of busy polling, so other threads keep running
CONFIG_SPI_ESP32_INTERRUPT=y
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y

CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_SHELL=y
CONFIG_FILE_SYSTEM_MKFS=y
# CONFIG_FILE_SYSTEM_SHELL_MOUNT_COMMAND=y

CONFIG_FAT_FILESYSTEM_ELM=y

CONFIG_FS_FATFS_LFN=y
# The app thread, the shell and the Wi-Fi work queue (config.txt) all use the SD card.
# REENTRANT needs the long file name buffer on the stack instead of a shared static one
CONFIG_FS_FATFS_LFN_MODE_STACK=y
CONFIG_FS_FATFS_REENTRANT=y
# Don't format the card automatically when mount fails (e.g. an exFAT card),
# use "fs mkfs" from the shell instead
CONFIG_FS_FATFS_MOUNT_MKFS=n

CONFIG_DISPLAY=y
CONFIG_ST7789V=y
CONFIG_LVGL=y
CONFIG_LV_COLOR_DEPTH_16=y
# No LV_COLOR_16_SWAP: the panel is pixel-format RGB_565X, so LVGL already renders big-endian
# (LV_COLOR_FORMAT_RGB565_SWAPPED). LV_COLOR_16_SWAP would swap the bytes back at flush.
CONFIG_LV_USE_LOG=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_DRAW_SW_COMPLEX=y
# CONFIG_LV_USE_FS_FATFS=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_18=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_48=y
# JPEG decoding uses the project copy in src/lib/tjpgd (RGB565 output, fastest mode)

# Menu stays alive under every app, and Files with ~20 rows plus the fade-in (both screens drawn)
# ran 32 KB out of memory. The RAM left over for the unused libc heap covers the increase.
CONFIG_LV_Z_MEM_POOL_SIZE=65536
# Draw buffer as % of the screen, larger means fewer flushes per frame.
# 10 instead of 20 frees 23 KB of DRAM region 0 for Wi-Fi
CONFIG_LV_Z_VDB_SIZE=10
# Must match LV_COLOR_DEPTH, otherwise the draw buffer is allocated twice as large
CONFIG_LV_Z_BITS_PER_PIXEL=16
# Render the next part while the previous one is sent to the display
CONFIG_LV_Z_FLUSH_THREAD=y
CONFIG_LV_Z_DOUBLE_VDB=y
# CONFIG_LV_Z_LVGL_MUTEX=y
CONFIG_LV_Z_USE_FILESYSTEM=y

CONFIG_LED=y
CONFIG_LED_GPIO=y

CONFIG_SENSOR=y
CONFIG_MPU6050=y

CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP_I2S=y

# Wi-Fi station, SSID / PSK from /config.txt on the SD card (src/wlan.c)
CONFIG_NETWORKING=y
CONFIG_WIFI=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_DHCPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_CONNECTION_MANAGER=y
# Host names (NTP server, HTTP APIs); the DNS servers come from DHCP
CONFIG_DNS_RESOLVER=y
# Default 2 s; the first queries right after connecting sometimes timed out (DNS_EAI_CANCELED)
CONFIG_NET_SOCKETS_DNS_TIMEOUT=5000
# Clock: time from an NTP server (src/net_time.c)
CONFIG_SNTP=y
# No ESP32_WIFI_STA_RECONNECT: src/wlan.c retries every 10 s itself. The driver's own retries
# race with "wlan set" / "wlan disconnect" and connect again after an explicit disconnect
# Fewer buffers than the defaults, DRAM region 0 is full (see HEAP_MEM_POOL_SIZE)
CONFIG_ESP32_WIFI_STATIC_RX_BUFFER_NUM=6
CONFIG_ESP32_WIFI_DYNAMIC_RX_BUFFER_NUM=16
CONFIG_ESP32_WIFI_DYNAMIC_TX_BUFFER_NUM=16
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=8
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=12
# The TCP receive window defaults to RX_COUNT * DATA_SIZE / 3, 682 bytes with 16 x 128: the 40 KB
# weather reply took 18 s from a server ~250 ms away. The buffer data is __noinit (DRAM region 1),
# only the buffer headers are in the full region 0, so the buffers grow instead of their number.
# 16 x 256 holds two full segments
CONFIG_NET_BUF_DATA_SIZE=256
CONFIG_NET_TCP_MAX_RECV_WINDOW_SIZE=2920
CONFIG_NET_MAX_CONTEXTS=4

# Hardware RNG for the Dice app
CONFIG_ENTROPY_GENERATOR=y

# Settings kept across reboots (storage partition in flash)
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

####
# CONFIG_SMP=y
# CONFIG_MP_MAX_NUM_CPUS=2

#### Debug: "kernel thread stacks" in the shell shows stack usage
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_NAME=y
# Used by the SysInfo app
CONFIG_THREAD_MONITOR=y
CONFIG_SYS_HEAP_RUNTIME_STATS=y

####
# CONFIG_APP_THREAD_SHOW_FPS=y
CONFIG_APP_MENU=y
# Measured peak 688 bytes
CONFIG_INPUT_THREAD_STACK_SIZE=2048
# The network stack also runs work on the system work queue: measured 784 / 1024 with Wi-Fi
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
